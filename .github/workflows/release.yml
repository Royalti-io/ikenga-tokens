# Release @ikenga/tokens via Changesets.
#
# Flow: PR with a changeset (`npx changeset`) → on merge to main this opens a
# "chore: version packages" PR → merging that publishes to npm (provenance) and
# creates a GitHub Release. Requires the NPM_TOKEN repo secret.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are required. `NODE_AUTH_TOKEN` is what setup-node's .npmrc
          # expands for the actual publish; `NPM_TOKEN` is what changesets/action
          # itself probes to decide *how* to authenticate. With NPM_TOKEN unset
          # the action logs "No NPM_TOKEN found, but OIDC is available" and
          # switches to npm trusted publishing, which this package is not
          # configured for on npmjs.com — so every publish 404s. That is what
          # silently broke releases from 2026-08-30 onward.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
